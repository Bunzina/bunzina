# Overlay opcional com a stack de observabilidade (Prometheus, Grafana, Loki,
# Tempo, Alloy). Uso:
#
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml up --build
#
# O compose "de trabalho" (docker-compose.yml) fica leve para o dia a dia; esse
# overlay só entra quando você quer validar dashboards, logs ou traces
# localmente antes de subir pro EKS. Ver docs/observability.md.
services:
  app:
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4318
      - OTEL_SERVICE_NAME=bunzina
    depends_on:
      - alloy
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
  loki:
    image: grafana/loki:3.5.0
    ports:
      - '3100:3100'
    command: ['-config.file=/etc/loki/config.yml']
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
  tempo:
    image: grafana/tempo:2.10.8
    command: ['-config.file=/etc/tempo/config.yml']
    volumes:
      - ./observability/tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
  alloy:
    image: grafana/alloy:v1.8.3
    command:
      ['run', '/etc/alloy/config.alloy', '--storage.path=/var/lib/alloy/data']
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - tempo
  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Contact point de alerta (observability/grafana/provisioning/alerting/)
      # usa o mailcatcher que já roda no compose base.
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: 'mailcatcher:1025'
      GF_SMTP_SKIP_VERIFY: 'true'
      GF_SMTP_FROM_ADDRESS: 'alerts@bunzina.local'
      GF_SMTP_FROM_NAME: 'Bunzina Alerting'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

volumes:
  prometheus-data:
  loki-data:
  tempo-data:
  alloy-data:
  grafana-data:
