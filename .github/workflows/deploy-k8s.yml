name: Deploy to Kubernetes (EKS)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: bunzina
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'bunzina-eks' }}
  K8S_NAMESPACE: bunzina

permissions:
  contents: read

jobs:
  detect-migration-changes:
    name: Detect Migration Changes
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.changed-migrations.outputs.any_changed }}
      migrations_added: ${{ steps.changed-migrations.outputs.any_added }}
      migrations_modified: ${{ steps.changed-migrations.outputs.any_modified }}
      migrations_deleted: ${{ steps.changed-migrations.outputs.any_deleted }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed migration files
        id: changed-migrations
        run: |
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-status -r "$HEAD_SHA" -- 'migrations/*.sql' || true)"
          else
            CHANGED_FILES="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'migrations/*.sql' || true)"
          fi

          echo "Changed migration files:"
          echo "$CHANGED_FILES"

          has_changed=false
          has_added=false
          has_modified=false
          has_deleted=false

          if [ -n "$CHANGED_FILES" ]; then
            has_changed=true

            while IFS=$'\t' read -r status _; do
              [ -z "$status" ] && continue

              case "$status" in
                A)
                  has_added=true
                  ;;
                D)
                  has_deleted=true
                  ;;
                M|R*|C*|T*)
                  has_modified=true
                  ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          {
            echo "any_changed=$has_changed"
            echo "any_added=$has_added"
            echo "any_modified=$has_modified"
            echo "any_deleted=$has_deleted"
          } >> "$GITHUB_OUTPUT"

  validate-migrations:
    name: Validate Migration Mutability
    runs-on: ubuntu-latest
    needs: detect-migration-changes
    if: ${{ needs.detect-migration-changes.outputs.migrations_changed == 'true' }}

    steps:
      - name: Block modified or deleted migration files
        run: |
          if [ "${{ needs.detect-migration-changes.outputs.migrations_modified }}" = "true" ] || [ "${{ needs.detect-migration-changes.outputs.migrations_deleted }}" = "true" ]; then
            echo "Only new files in migrations/*.sql are allowed on main."
            echo "Create a new migration instead of editing/removing old ones."
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test --config=./bunfig.ci.toml
        env:
          APP_ENV: prod
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  migrate-prod:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: [test, detect-migration-changes, validate-migrations]
    if: ${{ needs.detect-migration-changes.outputs.migrations_added == 'true' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS EKS access
        run: |
          echo "AWS account:"
          aws sts get-caller-identity
          echo "Region: $AWS_REGION"
          echo "Cluster: $EKS_CLUSTER_NAME"
          aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query 'cluster.name' --output text

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Run production migrations
        env:
          APP_ENV: prod
          DB_HOST: ${{ vars.DB_HOST || secrets.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || secrets.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: ${{ vars.DB_SSLMODE || secrets.DB_SSLMODE }}
        run: |
          if [ -n "$DB_HOST" ]; then
            export PROD_DATABASE_URL="$(python3 - <<'PY'
              import os
              import urllib.parse

              host = os.environ.get("DB_HOST", "")
              port = os.environ.get("DB_PORT", "5432")
              name = os.environ.get("DB_NAME", "postgres")
              user = os.environ.get("DB_USER", "")
              password = os.environ.get("DB_PASSWORD", "")
              sslmode = os.environ.get("DB_SSLMODE", "require")

              if not user or not password:
                  raise SystemExit("DB_USER and DB_PASSWORD are required")

              encoded_password = urllib.parse.quote(password, safe="")
              print(f"postgresql://{user}:{encoded_password}@{host}:{port}/{name}?sslmode={sslmode}")
            PY
            )"
          else
            kubectl port-forward -n "$K8S_NAMESPACE" svc/postgres 5432:5432 &
            PF_PID=$!
            trap 'kill $PF_PID' EXIT

            for i in $(seq 1 30); do
              if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then break; fi
              sleep 1
            done

            export PROD_DATABASE_URL="postgres://${DB_USER}:${DB_PASSWORD}@127.0.0.1:5432/bunzina"
          fi

          bun run migration

  deploy:
    name: Build & Deploy to EKS
    runs-on: ubuntu-latest
    needs:
      - test
      - detect-migration-changes
      - validate-migrations
      - migrate-prod
    if: >-
      ${{
        always() &&
        needs.test.result == 'success' &&
        (needs.validate-migrations.result == 'success' || needs.validate-migrations.result == 'skipped') &&
        (needs.migrate-prod.result == 'success' || needs.migrate-prod.result == 'skipped')
      }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS EKS access
        run: |
          echo "AWS account:"
          aws sts get-caller-identity
          echo "Region: $AWS_REGION"
          echo "Cluster: $EKS_CLUSTER_NAME"
          aws eks describe-cluster --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION" --query 'cluster.name' --output text

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null

      - name: Build, tag and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Log in to ECR for Helm (OCI)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | helm registry login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Resolve app-chart dependency from OCI
        run: helm dependency update charts/bunzina-chart

      - name: Deploy with Helm
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          DB_HOST: ${{ vars.DB_HOST || secrets.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT || secrets.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME || secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSLMODE: ${{ vars.DB_SSLMODE || secrets.DB_SSLMODE }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          DB_HOST_VALUE="${DB_HOST:-postgres}"
          DB_PORT_VALUE="${DB_PORT:-5432}"
          DB_NAME_VALUE="${DB_NAME:-bunzina}"

          HELM_EXTRA_ARGS=()
          if [ -n "$DB_HOST" ]; then
            HELM_EXTRA_ARGS+=(--set app-chart.database.enabled=false)
          fi

          helm upgrade --install bunzina charts/bunzina-chart \
            --namespace "$K8S_NAMESPACE" --create-namespace \
            --set app-chart.app.image.repository="${ECR_REGISTRY}/${ECR_REPOSITORY}" \
            --set app-chart.app.image.tag="$IMAGE_TAG" \
            --set app-chart.app.config.PROD_DB_HOST="$DB_HOST_VALUE" \
            --set app-chart.app.config.PROD_DB_PORT="$DB_PORT_VALUE" \
            --set app-chart.app.config.PROD_DB_NAME="$DB_NAME_VALUE" \
            --set app-chart.app.secret.PROD_DB_USER="$DB_USER" \
            --set app-chart.app.secret.PROD_DB_PASSWORD="$DB_PASSWORD" \
            --set app-chart.app.secret.JWT_SECRET="$JWT_SECRET" \
            --set app-chart.app.secret.API_KEY="$API_KEY" \
            --set app-chart.database.secret.POSTGRES_USER="$DB_USER" \
            --set app-chart.database.secret.POSTGRES_PASSWORD="$DB_PASSWORD" \
            --set app-chart.database.secret.POSTGRES_DB="$DB_NAME_VALUE" \
            "${HELM_EXTRA_ARGS[@]}" \
            --wait --timeout 10m

      - name: Verify rollout
        run: kubectl rollout status deployment/bunzina -n "$K8S_NAMESPACE" --timeout=180s
