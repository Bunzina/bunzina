name: Deploy to Kubernetes (EKS)

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-prod-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: bunzina
  EKS_CLUSTER_NAME: bunzina-eks
  K8S_NAMESPACE: bunzina

permissions:
  contents: read

jobs:
  detect-migration-changes:
    name: Detect Migration Changes
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.changed-migrations.outputs.any_changed }}
      migrations_added: ${{ steps.changed-migrations.outputs.any_added }}
      migrations_modified: ${{ steps.changed-migrations.outputs.any_modified }}
      migrations_deleted: ${{ steps.changed-migrations.outputs.any_deleted }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed migration files
        id: changed-migrations
        run: |
          BASE_SHA="${{ github.event.before }}"
          HEAD_SHA="${{ github.sha }}"

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES="$(git diff-tree --no-commit-id --name-status -r "$HEAD_SHA" -- 'migrations/*.sql' || true)"
          else
            CHANGED_FILES="$(git diff --name-status "$BASE_SHA" "$HEAD_SHA" -- 'migrations/*.sql' || true)"
          fi

          echo "Changed migration files:"
          echo "$CHANGED_FILES"

          has_changed=false
          has_added=false
          has_modified=false
          has_deleted=false

          if [ -n "$CHANGED_FILES" ]; then
            has_changed=true

            while IFS=$'\t' read -r status _; do
              [ -z "$status" ] && continue

              case "$status" in
                A)
                  has_added=true
                  ;;
                D)
                  has_deleted=true
                  ;;
                M|R*|C*|T*)
                  has_modified=true
                  ;;
              esac
            done <<< "$CHANGED_FILES"
          fi

          {
            echo "any_changed=$has_changed"
            echo "any_added=$has_added"
            echo "any_modified=$has_modified"
            echo "any_deleted=$has_deleted"
          } >> "$GITHUB_OUTPUT"

  validate-migrations:
    name: Validate Migration Mutability
    runs-on: ubuntu-latest
    needs: detect-migration-changes
    if: ${{ needs.detect-migration-changes.outputs.migrations_changed == 'true' }}

    steps:
      - name: Block modified or deleted migration files
        run: |
          if [ "${{ needs.detect-migration-changes.outputs.migrations_modified }}" = "true" ] || [ "${{ needs.detect-migration-changes.outputs.migrations_deleted }}" = "true" ]; then
            echo "Only new files in migrations/*.sql are allowed on main."
            echo "Create a new migration instead of editing/removing old ones."
            exit 1
          fi

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test
        env:
          APP_ENV: prod
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}

  migrate-prod:
    name: Run Production Migrations
    runs-on: ubuntu-latest
    needs: [test, detect-migration-changes, validate-migrations]
    if: ${{ needs.detect-migration-changes.outputs.migrations_added == 'true' }}
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Run migrations via port-forward to in-cluster Postgres
        env:
          APP_ENV: prod
        run: |
          kubectl port-forward -n "$K8S_NAMESPACE" svc/postgres 5432:5432 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT

          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/5432) >/dev/null 2>&1; then break; fi
            sleep 1
          done

          export PROD_DATABASE_URL="postgres://${{ secrets.DB_USER }}:${{ secrets.DB_PASSWORD }}@127.0.0.1:5432/bunzina"
          bun run migration

  deploy:
    name: Build & Deploy to EKS
    runs-on: ubuntu-latest
    needs:
      - test
      - detect-migration-changes
      - validate-migrations
      - migrate-prod
    if: >-
      ${{
        always() &&
        needs.test.result == 'success' &&
        (needs.validate-migrations.result == 'success' || needs.validate-migrations.result == 'skipped') &&
        (needs.migrate-prod.result == 'success' || needs.migrate-prod.result == 'skipped')
      }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres-service.yaml
          kubectl apply -f k8s/postgres-statefulset.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Set new image and wait for rollout
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          kubectl set image deployment/bunzina bunzina="$IMAGE_URI" -n "$K8S_NAMESPACE"
          kubectl rollout status deployment/bunzina -n "$K8S_NAMESPACE" --timeout=180s
