<text x="455.0" y="347" font-size="21" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">1. POST /auth/login</text>
<text x="455.0" y="391" font-size="20" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">{ document, password }</text>
<path d="M700,450 L1190,450" fill="none" stroke="#405574" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="945.0" y="437" font-size="21" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">2. Encaminha a requisição</text>
<rect x="990" y="485" width="400" height="88" rx="12" fill="#eaf1ff" stroke="#d1dae8" stroke-width="2"/>
<text x="1190" y="520" font-size="22" fill="#17253c" style="fill:#17253c" font-weight="700" text-anchor="middle">3. Valida payload e CPF</text>
<text x="1190" y="552" font-size="20" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">Dígitos verificadores</text>
<path d="M1190,635 L1680,635" fill="none" stroke="#405574" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1435.0" y="622" font-size="21" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">4. POST /auth/login via Axios</text>
<text x="1435.0" y="666" font-size="20" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">{ document, password }</text>
<path d="M1680,735 L2170,735" fill="none" stroke="#405574" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="1925.0" y="722" font-size="21" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">5. Consulta de autenticação</text>
<path d="M2170,815 L1680,815" fill="none" stroke="#405574" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text x="1925.0" y="802" font-size="21" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">6. Dados de usuário / cliente</text>
<rect x="1480" y="855" width="400" height="135" rx="12" fill="#f0eafb" stroke="#d1dae8" stroke-width="2"/>
<text x="1680" y="892" font-size="22" fill="#17253c" style="fill:#17253c" font-weight="700" text-anchor="middle">7. Valida credenciais</text>
<text x="1680" y="926" font-size="20" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">Verifica senha e status</text>
<text x="1680" y="960" font-size="23" fill="#17253c" style="fill:#17253c" font-weight="700" text-anchor="middle">Gera JWT</text>
<path d="M1680,1050 L1190,1050" fill="none" stroke="#405574" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text x="1435.0" y="1037" font-size="21" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">8. HTTP 200 + { token }</text>
<path d="M1190,1130 L700,1130" fill="none" stroke="#405574" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text x="945.0" y="1117" font-size="21" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">9. Repassa status e body</text>
<path d="M700,1210 L210,1210" fill="none" stroke="#405574" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text x="455.0" y="1197" font-size="21" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">10. Resposta de login</text>
<rect x="65" y="1280" width="2270" height="54" rx="12" fill="#eaf0f8" stroke="#d1dae8" stroke-width="2"/>
<text x="90" y="1316" font-size="23" fill="#17253c" style="fill:#17253c" font-weight="700" text-anchor="start">ACESSO POSTERIOR A UMA ROTA PROTEGIDA</text>
<path d="M210,1415 L1680,1415" fill="none" stroke="#405574" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="945.0" y="1402" font-size="21" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">11. Requisição via ALB + Authorization: Bearer &lt;token&gt;</text>
<rect x="1465" y="1450" width="430" height="85" rx="12" fill="#f0eafb" stroke="#d1dae8" stroke-width="2"/>
<text x="1680" y="1485" font-size="22" fill="#17253c" style="fill:#17253c" font-weight="700" text-anchor="middle">12. Middleware valida JWT</text>
<text x="1680" y="1518" font-size="20" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">API executa a rota solicitada</text>
<path d="M1680,1620 L210,1620" fill="none" stroke="#405574" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="9 7" marker-end="url(#arrow)"/>
<text x="945.0" y="1607" font-size="21" fill="#17253c" style="fill:#17253c" font-weight="400" text-anchor="middle">13. Resposta da API</text>
