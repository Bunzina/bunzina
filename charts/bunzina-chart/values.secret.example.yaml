# Modelo de segredos. Copie para values.secret.yaml (no .gitignore) e preencha:
#   cp values.secret.example.yaml values.secret.yaml
# Use no install/upgrade:  helm ... -f values.secret.yaml
#
# Gere segredos fortes por ambiente, ex.:
#   JWT_SECRET:        openssl rand -base64 48
#   *_PASSWORD:        openssl rand -base64 32
app-chart:
  app:
    secret:
      PROD_DB_USER: "bun"
      PROD_DB_PASSWORD: "CHANGE_ME"
      JWT_SECRET: "CHANGE_ME"
      EMAIL_SMTP_USER: ""
      EMAIL_SMTP_PASSWORD: ""
  database:
    secret:
      POSTGRES_USER: "bun"
      POSTGRES_PASSWORD: "CHANGE_ME"   # deve bater com app.secret.PROD_DB_PASSWORD
      POSTGRES_DB: "bunzina"
