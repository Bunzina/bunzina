apiVersion: v2
name: bunzina-chart
description: Umbrella chart do Bunzina — consome o app-chart genérico
type: application
version: 0.1.0
appVersion: "1.0.0"
dependencies:
  - name: app-chart
    version: "0.1.0"
    # Puxado do ECR (OCI). Publique o app-chart uma vez com:
