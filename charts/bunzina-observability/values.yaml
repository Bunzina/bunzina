# Stack de observabilidade demo-grade: kube-prometheus-stack (Prometheus + Grafana
# + node-exporter + kube-state-metrics) + Loki + Tempo + Alloy (duas instâncias:
# coleta de logs via API do Kubernetes, e gateway OTLP para traces).
#
# Tudo em modo single-binary/filesystem, sem S3, com retenção curta e recursos
# enxutos — combina com um cluster pequeno da AWS Academy e com o ambiente sendo
# destruído após a gravação do vídeo. Alertmanager fica desligado: o motor único
# de alertas é o Grafana unified alerting (ver `alerting/` e `dashboards/`).

kube-prometheus-stack:
  alertmanager:
    enabled: false

  prometheus:
    prometheusSpec:
      retention: 7d
      # Sem essa flag, Prometheus só vê ServiceMonitors com o label `release:
      # <nome-da-release>` (o do kube-prometheus-stack). O ServiceMonitor do
      # Bunzina não carrega esse label, então precisamos abrir o seletor.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: 500m
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: gp3
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 10Gi

  # kube-state-metrics + prometheus-node-exporter vêm habilitados por padrão no
  # kube-prometheus-stack e respondem pelo "CPU/memória do Kubernetes" do
  # task doc — não precisam de configuração adicional para este cluster.

  grafana:
    adminUser: admin
    # Sobrescrito via --set no CI (secret do GitHub) ou values.secret.yaml local.
    adminPassword: change-me
    ingress:
      enabled: true
      ingressClassName: alb
      annotations:
        alb.ingress.kubernetes.io/scheme: internet-facing
        alb.ingress.kubernetes.io/target-type: ip
        alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      hosts: [] # sem domínio próprio: regra sem host, aceita qualquer hostname do ALB.
    persistence:
      enabled: false # demo-grade: dashboards/datasources vêm de ConfigMap (as-code), não da UI.
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
    sidecar:
      dashboards:
        enabled: true # já é o default do chart; explícito para documentar o mecanismo.
        label: grafana_dashboard
        labelValue: "1"
    # Prometheus e Alertmanager já entram como datasource automaticamente. Loki e
    # Tempo, que vivem em charts separados nesta mesma release, são adicionados
    # aqui. A correlação trace -> log usa o campo `trace_id` extraído do JSON
    # (ver docs/observability.md).
    additionalDataSources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.observability.svc.cluster.local:3100
        jsonData:
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              name: TraceID
              url: "$${__value.raw}"
      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo.observability.svc.cluster.local:3200
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            filterByTraceID: true
          serviceMap:
            datasourceUid: prometheus

loki:
  fullnameOverride: loki
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    storage:
      type: filesystem
    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      allow_structured_metadata: true
      volume_enabled: true
      retention_period: 72h
    compactor:
      retention_enabled: true
      delete_request_store: filesystem

  # SingleBinary concentra tudo; os componentes de modo "simple scalable" (SSD)
  # e o compactor standalone precisam ficar em zero, senão o chart falha a
  # validação (não dá para ter os dois modos com réplicas > 0 ao mesmo tempo).
  write:
    replicas: 0
  read:
    replicas: 0
  backend:
    replicas: 0
  compactor:
    replicas: 0

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi
      storageClass: gp3
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # Sem cache memcached, gateway, canary e teste de Helm — footprint mínimo.
  gateway:
    enabled: false
  lokiCanary:
    enabled: false
  test:
    enabled: false
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false
  minio:
    enabled: false

tempo:
  fullnameOverride: tempo
  # OTLP gRPC (4317) e HTTP (4318) já vêm habilitados por padrão no chart.
  # Storage local (filesystem) também já é o default — nada a mudar ali.
  tempo:
    retention: 48h
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
    storageClassName: gp3

# Alloy roda duas vezes nesta mesma release (ver aliases em Chart.yaml):
# - alloy-logs: Deployment único que descobre pods via API do Kubernetes e
#   envia os logs para o Loki. Não usa hostPath nem Docker socket — só as
#   permissões de leitura de pods/namespaces/pods-log que o chart já inclui
#   por padrão em `rbac.rules`.
# - alloy-gateway: Deployment que recebe OTLP (gRPC/HTTP) da aplicação e
#   encaminha para o Tempo.
alloy-logs:
  fullnameOverride: alloy-logs
  controller:
    type: deployment
    replicas: 1
  alloy:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    configMap:
      content: |
        discovery.kubernetes "pods" {
          role = "pod"
        }

        loki.source.kubernetes "pods" {
          targets    = discovery.kubernetes.pods.targets
          forward_to = [loki.write.default.receiver]
        }

        loki.write "default" {
          endpoint {
            url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
          }
        }

alloy-gateway:
  fullnameOverride: alloy-gateway
  controller:
    type: deployment
    replicas: 1
  alloy:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    extraPorts:
      - name: otlp-grpc
        port: 4317
        targetPort: 4317
        protocol: TCP
      - name: otlp-http
        port: 4318
        targetPort: 4318
        protocol: TCP
    configMap:
      content: |
        otelcol.receiver.otlp "default" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }

          http {
            endpoint = "0.0.0.0:4318"
          }

          output {
            traces = [otelcol.exporter.otlphttp.tempo.input]
          }
        }

        otelcol.exporter.otlphttp "tempo" {
          client {
            endpoint = "http://tempo.observability.svc.cluster.local:4318"

            tls {
              insecure = true
            }
          }
        }
