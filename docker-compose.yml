services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/.bun
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgres://bun:bun@db:5432/bunzina
      - EMAIL_SMTP_HOST=mailcatcher
      - EMAIL_SMTP_PORT=1025
      - EMAIL_SMTP_USER=
      - EMAIL_SMTP_PASSWORD=
    depends_on:
      db:
        condition: service_healthy
    command: ['bun', 'run', 'start:with-migrations']
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - app
  loki:
    image: grafana/loki:3.5.0
    ports:
      - '3100:3100'
    command: ['-config.file=/etc/loki/config.yml']
    volumes:
      - ./observability/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
  alloy:
    image: grafana/alloy:v1.8.3
    command:
      ['run', '/etc/alloy/config.alloy', '--storage.path=/var/lib/alloy/data']
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bunzina
      POSTGRES_USER: bun
      POSTGRES_PASSWORD: bun
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bun -d bunzina']
      interval: 5s
      timeout: 5s
      retries: 5
  db_test:
    image: postgres:15
    environment:
      POSTGRES_DB: bunzina_test
      POSTGRES_USER: bun
      POSTGRES_PASSWORD: bun
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bun -d bunzina_test']
      interval: 5s
      timeout: 5s
      retries: 5

  mailcatcher:
    image: 'sj26/mailcatcher'
    ports:
      - '1025:1025'
      - '1080:1080'

volumes:
  db-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
