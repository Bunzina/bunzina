services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    volumes:
      - ./:/app
      - /app/.bun
    environment:
      - APP_ENV=dev
      - DATABASE_URL=postgres://bun:bun@db:5432/bunzina
      - JWT_SECRET=dev-secret-change-me
      - API_KEY=local-dev-catalog-key
      - EMAIL_SMTP_HOST=mailcatcher
      - EMAIL_SMTP_PORT=1025
      - EMAIL_SMTP_USER=
      - EMAIL_SMTP_PASSWORD=
    depends_on:
      db:
        condition: service_healthy
    command: ['bun', 'run', 'start:with-migrations']
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: bunzina
      POSTGRES_USER: bun
      POSTGRES_PASSWORD: bun
    ports:
      - '5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bun -d bunzina']
      interval: 5s
      timeout: 5s
      retries: 5
  db_test:
    image: postgres:15
    environment:
      POSTGRES_DB: bunzina_test
      POSTGRES_USER: bun
      POSTGRES_PASSWORD: bun
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bun -d bunzina_test']
      interval: 5s
      timeout: 5s
      retries: 5

  mailcatcher:
    image: 'sj26/mailcatcher'
    ports:
      - '1025:1025'
      - '1080:1080'

  # Mesmo broker do cluster (ADR 0015, bunzina-infra/charts/rabbitmq): imagem e
  # credenciais iguais às do docker-compose de bunzina-os, -billing e -workshop.
  # Os serviços declaram exchange, filas e DLQ ao conectar. Management em :15672.
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: bunzina
      RABBITMQ_DEFAULT_PASS: bunzina
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'check_port_connectivity']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db-data:
